name: Firebase-configured Android debug build

on:
  workflow_dispatch:
  push:
    branches:
      - 'audit/fix-firestore-buildconfig-2026-11-19'

permissions:
  contents: read

jobs:
  firebase-debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
          cache-disabled: true
      - name: Validate and materialize private Firebase configuration
        env:
          FIREBASE_ANDROID_JSON: ${{ secrets.FIREBASE_ANDROID_JSON }}
        run: python3 scripts/prepare-firebase-config.py
      - name: Assemble Firebase-configured debug APK
        run: gradle assembleDebug --console=plain
      - name: Remove private Firebase configuration
        if: always()
        run: rm -f app/google-services.json
      - uses: actions/upload-artifact@v4
        with:
          name: StreamFlowPro-Firebase-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
