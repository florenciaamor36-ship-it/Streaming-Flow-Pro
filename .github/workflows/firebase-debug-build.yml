name: Firebase-configured Android debug build

on:
  workflow_dispatch:
  push:
    branches:
      - 'audit/firebase-config-runtime-synthesis-2026-11-20'

permissions:
  contents: read

jobs:
  firebase-debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
          cache-disabled: true
      - name: Test Firebase configuration synthesis
        run: python3 scripts/test-prepare-firebase-config.py
      - name: Validate and synthesize Android Firebase configuration
        env:
          FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
          FIREBASE_PROJECT_NUMBER: ${{ vars.FIREBASE_PROJECT_NUMBER }}
          FIREBASE_ANDROID_APP_ID: ${{ vars.FIREBASE_ANDROID_APP_ID }}
          FIREBASE_ANDROID_PACKAGE_NAME: ${{ vars.FIREBASE_ANDROID_PACKAGE_NAME }}
          FIREBASE_ANDROID_API_KEY: ${{ vars.FIREBASE_ANDROID_API_KEY }}
        run: python3 scripts/prepare-firebase-config.py
      - name: Run unit tests
        run: gradle testDebugUnitTest --console=plain
      - name: Assemble Firebase-configured debug APK
        run: gradle assembleDebug --console=plain
      - name: Remove synthesized Firebase configuration
        if: always()
        run: rm -f app/google-services.json
      - uses: actions/upload-artifact@v4
        with:
          name: StreamFlowPro-Firebase-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
