name: Build production WebView APK
on:
  workflow_dispatch:
  push:
    branches: ["release/production-web-staging"]
permissions:
  contents: read
jobs:
  build-preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
          cache-disabled: true
      - name: Build production-target debug APK
        run: gradle assembleDebug testDebugUnitTest --console=plain
        env:
          WEB_APP_URL: https://florenciaamor36-ship-it.github.io/stream/
      - uses: actions/upload-artifact@v4
        with:
          name: StreamFlowPro-WebView-production-target-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
