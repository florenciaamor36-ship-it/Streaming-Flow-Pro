name: Audit branch unit tests

on:
  push:
    branches:
      - 'audit/**'

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
          cache-disabled: true
      - name: Assemble debug and run local tests only (no signing or upload)
        shell: bash
        run: |
          set +e
          gradle assembleDebug test --console=plain > "$RUNNER_TEMP/gradle-test.log" 2>&1
          result=$?
          if [ "$result" -ne 0 ]; then
            python3 - "$RUNNER_TEMP/gradle-test.log" <<'PYTEST'
          import re, sys
          failure = re.compile(r"^.* > .* FAILED$")
          task = re.compile(r"^> Task .* FAILED$")
          count = re.compile(r"^\d+ tests? completed, \d+ failed$")
          sdk = re.compile(r"Android SDK \d+ requires Java \d+ \(have Java \d+\)")
          exception = re.compile(r"(?:[A-Za-z_$][\w$]*\.)*[A-Za-z_$][\w$]*(?:Exception|Error)(?: at [\w.$]+:\d+)?")
          output = []
          for raw in open(sys.argv[1], encoding="utf-8", errors="replace"):
              line = raw.strip()
              if failure.fullmatch(line) or task.fullmatch(line) or count.fullmatch(line) or sdk.search(line):
                  output.append(line)
              elif "Exception" in line or "Error" in line:
                  match = exception.search(line)
                  if match:
                      # Emit only exception type and source frame, never an exception message.
                      output.append(match.group(0))
          if output:
              for line in dict.fromkeys(output):
                  print("::error title=Gradle test diagnostic::" + line)
          else:
              print("::error title=Gradle test failure::Gradle test task failed; no safe diagnostic summary was found.")
          PYTEST
          else
            python3 - "$RUNNER_TEMP/gradle-test.log" <<'PYTEST'
          import glob, os, re, sys, xml.etree.ElementTree as ET
          log = open(sys.argv[1], encoding="utf-8", errors="replace")
          for raw in log:
              line = raw.strip()
              if re.fullmatch(r"> Task :(?:app:)?(?:assembleDebug|testDebugUnitTest)(?: UP-TO-DATE)?", line):
                  print(line)
          totals = [0, 0, 0, 0]
          for path in glob.glob("app/build/test-results/testDebugUnitTest/TEST-*.xml"):
              root = ET.parse(path).getroot()
              vals = [int(root.get(k, "0")) for k in ("tests", "failures", "errors", "skipped")]
              totals = [a + b for a, b in zip(totals, vals)]
          print(f"Unit tests: {totals[0]} tests, {totals[1]} failures, {totals[2]} errors, {totals[3]} skipped")
          print("BUILD SUCCESSFUL")
          PYTEST
          fi
          exit "$result"
