name: Build Android APK

on:
  push:
    branches: [ "main", "master", "release/production-web-staging" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
          cache-disabled: true

      - name: Build Debug APK
        run: gradle assembleDebug testDebugUnitTest --console=plain
        env:
          WEB_APP_URL: https://florenciaamor36-ship-it.github.io/stream/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: StreamFlowPro-production-target-debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
